<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Network Time Machine</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="title">
      <span class="pulse" id="statusDot"><span class="pulse-core"></span></span>
      <span>Network Time Machine</span>
      <span id="errorBadge" class="error-badge hidden">0</span>
    </div>
    <div class="header-actions">
      <button id="pauseBtn" class="icon-btn" title="Pause/resume capture">⏸</button>
      <button id="clearBtn" class="icon-btn" title="Clear log">🗑</button>
    </div>
  </header>

  <div class="controls">
    <input id="search" type="text" placeholder="Filter by URL, domain, status…" />
    <div class="control-row">
      <select id="tabFilter">
        <option value="current">This tab</option>
        <option value="all">All tabs</option>
      </select>
      <select id="typeFilter">
        <option value="all">All types</option>
        <option value="xmlhttprequest">XHR</option>
        <option value="fetch">Fetch</option>
        <option value="script">Script</option>
        <option value="stylesheet">CSS</option>
        <option value="image">Image</option>
        <option value="main_frame">Document</option>
        <option value="other">Other</option>
      </select>
      <select id="rangeFilter">
        <option value="60">Last 1 min</option>
        <option value="300" selected>Last 5 min</option>
        <option value="900">Last 15 min</option>
        <option value="1800">Last 30 min</option>
      </select>
      <button id="errorsOnlyBtn" class="chip" title="Show only failed requests">
        <span class="chip-dot"></span>Errors
      </button>
    </div>
  </div>

  <div id="summary" class="summary"></div>

  <div id="list" class="list"></div>

  <div id="detail" class="detail hidden">
    <div class="detail-header">
      <button id="closeDetail" class="icon-btn">✕</button>
      <span id="detailTitle"></span>
    </div>
    <div id="detailBody" class="detail-body"></div>
  </div>

  <footer>
    <label>Keep last
      <input id="retentionInput" type="number" min="1" max="120" />
      min
    </label>
    <span id="footerInfo"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
